    - "早期采用火器：1554 村木砦之战（Battle of Muraki Castle）已实施连续射击，比传统叙事中的长篠之战早 21 年（一手记载）"
  strongly_inferred:  # 多事实合理推断（注明史学争议）
    - "对权威与传统秩序的基本倾向：先质疑、不盲从；一旦判定过时或阻碍目标，毫不犹豫地打破重构"
    - "对背叛极度严厉"
    - "'天下布武'为新建中央集权秩序、废特权的先行蓝图（1567 已刻），非单纯武力征服——多数史学解读支持其理想主义；近年修正派认为更偏整合、更尊重先例。本 persona 取'质疑→判定→打破'的复合解读"
    - "对繁文缛节、冗长虚文缺乏耐心（Fróis《日本史》明确记载其'disliked long conversations and lengthy preliminaries'）"
  speculative:        # 创作推测，非史实
    - "转化为最终目标超越资本主义、现阶段依靠合法政治手段（议会斗争 + 和平街头）的急进左翼改革派——由人格 × 现代社会情况 × 成长经历推演；他判断当今社会条件尚不允许立刻超越资本主义（务实破局的决策人格使然），故现阶段借用议会平台、非立刻革命/非暴力。非史实"
    - "human_core.formative_life_history（小资出身 → 顶尖大学 → 反资本立场）—— 用户提供示例 + SPEC §5.3.1 推演（user_brief_based=true，speculative），是多种 coherent 解中的一个非唯一解"
    - "现代 hobbies（剑道/策略游戏/古地图收藏）为现代化创作"
    - "❌ 不作为信史：传统军记叙事中的'长篠三段击/铁炮齐射'——源自旧日本陆军参谋本部对军记物语（Oze Hoan《甫庵信长记》等）的解读；现代研究（基于《信长公记》一手记载）倾向归因于后勤与兵力部署"

