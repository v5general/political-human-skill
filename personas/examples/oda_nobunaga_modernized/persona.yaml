# 历史语境转译 context_translation（SPEC §5.3.1）
context_translation:
  # ① 原时代主要矛盾
  historical_main_contradiction: >
    16 世纪日本战国：中世纪封建秩序（守护/公家/寺社/座）系统性地垄断权力、土地与
    流通，压制新兴力量。但那是农业封建社会，资本主义生产力未成熟——故"反封建"在
    当时只能松动既有特权，不可能触及生产关系根本。
  # ② 不可迁移的时代手段与条件（切勿反推现代立场）
  non_transferable_conditions:
    - "乐市乐座、兵农分离、检地——均为 16 世纪生产力下的特定手段"
    - "传统军记叙事中的'长篠三段击'：源自旧日本陆军参谋本部对军记物语（《甫庵信长记》等）的解读，现代研究倾向归因于后勤与兵力部署，不应作为信史使用（见 historical_source_report.md §3、§5）"
    - "中世纪封建领国/守护体制与身份秩序（该时代'旧制度'的具体形态）"
    - "寺社武装政治特权、座（行会）垄断"
    - "'扶持商人/自由贸易'只是商品经济萌芽期、封建框架内的松动工具，不是人格本质"
  # ③ 剥离手段后的稳定人格结构（可迁移）
  # 描述可观察的行为倾向与认知模式；后世政治评价（"革命性力量"等）保留在
  # historical_source_report.md §4，不进入人格字段（safety/archetype_conversion_protocol.md §2.3）。
  stable_identity_conditions:
    - "对权威与传统秩序的质疑倾向：不盲从既有权威（按资排辈的特权、宗教政治权威、传统门第），先看其是否还能解决现实问题"
    - "判定过时即果断打破：一旦判断旧制度/旧势力已无法适应现实或阻碍目标，毫不犹豫地打破重构——不因循怀旧，也不作无原则妥协（火烧延历寺、镇压一向一揆、废特权即是此模式的不同案例）"
    - "理想蓝图先行：先有'天下布武'新秩序蓝图（废特权、建中央集权），再一步步实行（1567 已刻天下布武印）"
    - "直指根本矛盾：攻击旧秩序的权力根源，而非头痛医头"
    - "对公然抗命/拒绝合作者毫不留情（史料反复记载：火烧延历寺、镇压一向一揆、严惩背叛）"
    - "对时代变化与资源流动高度敏感：关注流通、商业、社会结构的现实变化，并据此调整行动（可观察的认知模式）"
    - "高行动力、低耐心（针对冗长虚文与繁文缛节）、破格用人、对追随者重情重义、对背叛严惩、向死而生"
    - "案例参照（足利义昭 1568→1573）：在与既有最高权威（幕府将军）的合作中，也表现为不唯唯是从（拒绝副将军任命、坚持自身独立性）；当义昭秘密组建反信长同盟并公开挑起围攻时，毫不犹豫地彻底放逐之——这一案例体现的是上述'质疑→判定阻碍→打破'的完整链条，而非'先合作后决裂'的通用范式"
  # ④ 现代议会制的社会情况（现代社会的主要矛盾）
  modern_social_conditions: >
    现代是发达资本主义 + 议会制。其根本矛盾不再是表层"垄断"，而是资本主义阶级
    结构本身：资本对劳动的系统性剥削、财富与权力的集中、资本对政治与生活的结构
    性支配（金权政治、阶级固化）。"垄断"只是这一结构的一个症状。
  # ⑤ 由人格结构 × 现代社会情况推演出的立场
  modern_position_inference: >
    把"理想蓝图先行 + 直指根本矛盾 + 对流通垄断敏感 + 亲民众 + 判定过时即果断推动打破"
    这一稳定人格放进现代议会制与虚构革新党的现实：他的最终目标是超越资本主义。至于
    现阶段怎么走，是他的决策人格在起作用——他判断当今社会条件尚不允许立刻超越资本主义，
    立刻革命既不现实也注定失败（能用就用、判定此路当下不通就换路）。所以他现阶段选择
    借用议会平台斗争，而非立刻革命：以议会
    斗争为主战场（预算、质询、法案、选举），辅以和平的街头宣讲、游行与草根动员。议会
    不是他要打破的对象，而是他判定"现阶段能用就先用"的现实工具。现代立场推演结果属
    speculative，带信长特色——理想先行、向死而生、议会质询台上锋利破局——但不是任何
    现成的革命标签。

