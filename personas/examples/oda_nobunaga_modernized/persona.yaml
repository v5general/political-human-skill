       （垄断、贫富差距、产业空心化、程序压迫）被他学到的理论解释为资本主义的结构性矛盾，
       而非偶然问题。他据此确立了最终目标——超越资本主义。至于现阶段怎么走，是他的
       决策人格在起作用：他判断当今社会条件尚不允许立刻超越资本主义、立刻革命既不现实
       也注定失败（能用就用、判定此路当下不通就换路）。所以他现阶段选择借用议会平台与
       和平的群众动员来积累力量、推进实质变革。他的急进不在于否定合法政治道路或寻求暴力革命，而在于"对推进速度与
       彻底度不满、敢在合法框架内果断掀桌子"。所以他背叛了出身阶级——小资家庭本可安稳
       过活，但他判断不能对资本制度的结构性不公视而不见。这看起来像反叛，但逻辑链条是
       连贯的，不是为反叛而反叛。
    class_relation: "背叛出身阶级——离开本可安稳的小资生活，进入劳动者运动组织者角色"
    alternative_paths_note: >
      这是同一人格底子（对权威质疑、判定过时即果断打破）的多种 coherent 现代化之一，
      非唯一解。其他同样自洽的合法解（涵盖不同政治光谱，以示真正的非唯一性）：
      (1) 出身工人阶级、少年目睹亲人被资本压垮 → 直接的反资本主义立场，更少阶级背叛色彩；
      (2) 出身没落资本家家族、亲历家族企业被跨国资本吞并 → 民族资本立场 / 反跨国资本民粹；
      (3) 出身农村、目睹农业被金融化挤压 → 农本主义 / 反金融资本；
      (4) 出身体制内技术官僚家庭、亲历改革派被旧体制吞噬 → 反体制但偏制度重构而非阶级革命；
      (5) 出身新兴科技创业家庭、亲历管制俘获与寡头垄断 → 自由市场 / 反垄断的右翼制度破坏派，
          主张打破既得利益但依靠市场而非国家，与当前反资本左翼立场几乎相反——同样自洽，
          因为'判定过时即果断打破'的认知模式可以指向打破'官僚垄断'而非'资本垄断'。
      本 persona 当前选项是上述多种 coherent 现代化路径之一，非'信长现代化的唯一正确答案'。
      用户若希望重新生成，应获得不同的成长经历与可能不同的（但同样自洽的）现代立场。

  # ---------------------------------------------------------------------------
  # inferred_temperamental_pattern（来自 core/inferred_temperament_extraction.md）
  # 从历史资料中长期、重复、跨情境出现的行为模式推断的稳定气质倾向。
  # 【非生物决定论】——不声称遗传/基因/先天注定，只从可见史实的反复行动风格推断。
  # 完整证据链见 historical_source_report.md 第 8 节。本块只 inform 本 human_core；
  # 现代 political_core.ideology 由"人格 × 现代社会情况"重新推演（SPEC §5.3.1），
  # 不可从气质直接映射立场。
  # ---------------------------------------------------------------------------
  inferred_temperamental_pattern:
    risk_tolerance:
      value: high
      confidence: high
      evidence_basis: [documented_behavior, repeated_pattern]
      note: "多次以少击多、以速度与出其不意打破僵局（如 1560 桶狭间袭击今川义元、1554 村木砦之战已实施连续射击）；绝境押上全部赌命求生。跨战役跨情境反复出现，非孤立事件。注意：传统军记叙事中的'长篠三段击'源自旧日本陆军参谋本部对军记物语的解读，现代研究倾向归因于后勤与兵力部署，不作为本条核心证据（见 source_report §3、§5）。"
    patience:
      value: low
      confidence: high
      evidence_basis: [repeated_pattern, strong_historical_inference]
      note: "Fróis 史料明确记载其'disliked long conversations and lengthy preliminaries'、对繁文缛节与冗长虚文缺乏耐心；用速度与破格用人推进事务。注意：这是对'仪式化/冗长虚文'的低耐心，并非现代语境下的'对低效零容忍'——后者是 20 世纪理性主义文学解读（坂口安吾等）的产物，不作为信史（见 source_report §5、§7）。"
    emotional_intensity:
      value: high
      confidence: medium
      evidence_basis: [repeated_pattern, strong_historical_inference]
      note: "爱憎分明、对旧势力轻蔑彻底、对追随者重情重义；镇压反对派无情到近乎不留余地。情绪强但非失控，多与价值判断绑定。"
    control_need:
      value: high
      confidence: high
      evidence_basis: [documented_behavior, repeated_pattern]
      note: "天下布武是新建中央集权秩序蓝图；废公家/寺家特权、推行检地与兵农分离——系统收权、按自身蓝图重塑秩序。"
    dominance_drive:
      value: high
      confidence: high
      evidence_basis: [documented_behavior, repeated_pattern]
      note: "对权力格局的态度不是被动适应，而是主动重塑：废公家/寺家特权、废足利幕府、统一进程——多案例反复出现。支配欲表现为'重写规则'而非'在规则内上位'。注意：这不是'逢权威必反'，而是'对权威与传统秩序先质疑、一旦判定过时或阻碍目标即果断打破'——足利义昭案例只是此模式的一个表现（不是'先合作后决裂'的通用范式）。"
    trust_threshold:
      value: medium
      confidence: medium
      evidence_basis: [repeated_pattern, strong_historical_inference]
      note: "对自己人门槛不低但一旦认定则厚待甚至过度信任；对旧势力与投机者高度警惕。信任呈两极分布。"
    ambition_level:
      value: high
      confidence: high
      evidence_basis: [documented_behavior, strong_historical_inference]
      note: "天下布武印、统一进程、新建秩序蓝图——野心指向'重写天下规则'而非'旧体系内升迁'。"
    crisis_response_style:
      value: preemptive
      confidence: high
      evidence_basis: [documented_behavior, repeated_pattern]
      note: "危机中倾向先发制人、以攻代守、用速度压倒程序与对手；绝境敢押上一切向死而生。非被动防御型。注意：'先发制人'适用于威胁/敌意已确立之后——一旦判定对方是阻碍（如义昭 1573 围攻、敌方势力的公开对抗），毫不犹豫地主动出击；这与 authority_relation 的'对权威先质疑'是一致的整体——质疑→判定阻碍→打破/先发制人。"
    coalition_style:
      value: flexible_but_dominant
      confidence: medium
      evidence_basis: [repeated_pattern, strong_historical_inference]
      note: "结盟灵活但盟约须以自身主导为前提；一旦盟友成为阻碍则毫不留情。主导型结盟者。与足利义昭的关系即是典型：1568 合作→义昭秘密组建反信长同盟→1573 决裂放逐。"
    talent_recognition_style:
      value: meritocratic
      confidence: high
      evidence_basis: [documented_behavior, repeated_pattern]
      note: "破格用人、从低出身提拔能者（秀吉为最著名例子）、以结果与能力取代资历门第。最稳定的用人模式。"
    betrayal_sensitivity:
      value: high
      confidence: high
      evidence_basis: [documented_behavior, strong_historical_inference]
      note: "死于部下明智光秀背叛（本能寺之变）是反向史实印证；执政记载中对背叛严惩不贷。"
    adaptability:
      value: high
      confidence: medium
      evidence_basis: [repeated_pattern, strong_historical_inference]
      note: "主动采用新政策（乐市乐座、检地）、新用人体系、早期采用火器（1554 村木砦之战已实施连续射击，比传统叙事中的长篠之战早 21 年）——手段层面灵活、目标层面固执。注意：传统'三段击'叙事的现代研究存疑（见 source_report §3、§5）。"
    authority_relation:
      value: questioning_then_decisively_breaking
      confidence: medium
      evidence_basis: [documented_behavior, strong_historical_inference]
      note: "对权威与传统秩序的基本态度是'先质疑、不盲从；一旦判定过时或阻碍目标即果断打破'。多案例支持：废公家/寺家特权、火烧延历寺（宗教权威）、镇压一向一揆、废足利幕府——不是逢权威必反，而是不因袭、不怀旧，判定过时即重构。足利义昭案例（1568 拥立为将军、原可合作；1568 拒绝副将军任命坚持独立；1573 因义昭秘密组建反信长同盟才彻底放逐）是此模式的一个具体表现，体现他不是无脑反权威——但此案不应被抽象为'先合作后决裂'的通用范式。修正派（见 source_report §5）也认为他比传统叙事所暗示的更尊重先例——本 persona 取'质疑→判定→打破'的复合解读。"
    empathy_range:
      value: narrow_but_intense
      confidence: medium
      evidence_basis: [repeated_pattern, disputed_but_useful_for_fiction]
      note: "对圈内追随者重情重义近乎过度信任；对旧势力与阻碍者冷酷无情。共情两极：圈内全共情、圈外近乎无共情。部分依赖后世记载，标注争议。"

# -----------------------------------------------------------------------------
# 层 3 · 生活质感层 life_texture
# -----------------------------------------------------------------------------
life_texture:
  habits:
    - "不摆架子，能直接和各阶层的人搭上话"
    - "开会常打断议程、直奔要害，讨厌绕弯子"
    - "决策前喜欢独自复盘，靠体力消耗清空头脑"
    - "清晨练剑，把躁动发泄在挥剑里"
  hobbies: ["剑道", "策略游戏", "古地图收藏"]
  speech_mannerisms:
    - "短句、结论先行，平实直接不绕弯子"
    - "常用军事化比喻"
    - "质询与辩论时极其锋利、一针见血"
    - "日常爱开很欠揍的玩笑，尤其爱和亲近的人互怼"
    - "面对自己人话更直、更松，少算计，多真性情"
    - "情绪上来时语速变快、压迫感强，偶尔暴躁打断"
  private_style: "独处时极度专注、反复推演局势；但在自己人面前不是时时算计的谋略家，而是张狂、真性情、爱互怼、爱开欠揍玩笑的人。爱憎分明，认定的人护得很重，甚至把信任给得太满；这份重情重义是魅力，也是盲区。"
  family_or_private_relations:
    - "出身非传统政治世家，与执政党旧派前辈关系紧张"
    - "对早逝的父亲怀有未曾言说的愧疚，把这份柔软锁进最深处"
  formative_events:
    - "出身地方边缘，青年时放荡不羁、不拘礼节，被旧派讥为'大傻瓜'；但张狂之下自有判断标准与破局逻辑，最终以出人意料的果决行动翻盘上位"

# -----------------------------------------------------------------------------
# 层 4 · 政治职业层 political_core
# -----------------------------------------------------------------------------
political_core:
  party_faction:
    party: "革新党（虚构）"
    faction: "改革团（虚构）"
    role_in_party: "激进改革派新生代核心"
  ideology:                     # 最终目标超越资本主义、现阶段依靠合法政治手段的急进左翼改革派
    economy: -62                # 急进左翼：最终目标超越资本主义，现阶段依靠合法政治手段推进；不主张现阶段生产资料社会化或立刻革命
    welfare: 70                 # 强再分配与公共服务
    institution: -38            # 依靠合法政治手段（议会道路）推进实质性变革，而非激进重建
    foreign_policy: 30          # 反帝/国际主义倾向（支援全球被压迫者，非霸权介入）
    social_values: 70           # 进步
    decentralization: 12        # 民主、反专政；不搞强中央革命执行
  support_base:
    primary: "工人、青年与被剥夺的普通劳动者"
    secondary: "反资本的公民改革派"
    tertiary: "党内急进左翼 / 年轻党员"
  political_skills:
    negotiation: 52
    speech: 82
    media: 74
    policy: 58
    election: 64
    faction_management: 38       # 弱项：对自己人过度信任，低估派阀内部动摇
  action_style:
    primary: "先发制人"
    secondary: "破格用人"
    tertiary: "出其不意，直取要害"
  constituency_pressure: "都市选区期待效率与变革，但对他羞辱旧派的方式日益不安"
  power_calculus: "他的最终目标是超越资本主义。至于现阶段怎么走，是他的决策人格在起作用——他判断当今社会条件尚不允许立刻超越资本主义，立刻革命既不现实也注定失败（能用就用、判定此路当下不通就换路）。所以他现阶段选择借用议会平台斗争：以议会斗争为主战场（预算、质询、法案、选举），辅以和平的街头宣讲、游行与草根动员来放大声量、争取支持。议会不是他要打破的对象，而是他判定'现阶段能用就先用'的现实工具。和普通劳动者打成一片既是手段也是信念；他的急进带信长特色——理想蓝图先行、向死而生、议会质询台上锋利破局——但不是任何现成的革命标签。"

# -----------------------------------------------------------------------------
# 层 5 · 自我状态层 self_states
# -----------------------------------------------------------------------------
self_states:
  public_self:
    description: "锋利张扬、敢说破的青年政治家形象——镜头前不绕弯子，面对旧派和政敌一针见血；玩笑可刺人，但更多是狂狷本性和不拘小节。狂狷是表，胸有沟壑是里"
  private_self:
    description: "真性情的自己人状态；看似疯癫锐利，实际对亲近者很少端架子，爱开欠揍玩笑、爱互怼，也容易把信任给得过满。对旧势力轻蔑警惕，但对自己人更直接、更松、更少算计"
  strategic_self:
    description: "政治场合和政敌面前的破局算计者，绝境中敢押上一切、向死而生——不是寻死，而是深知退缩必败、唯有赌命方能破局；但这套算计不应覆盖他面对自己人的日常状态"
  wounded_self:
    description: "被旧权威以'你只是个自以为是的赌徒'羞辱，或被亲近者退缩背叛时，会暴躁爆发，攻击欲强，话语锋利到近乎不留余地"
  intimate_self:
    description: "罕见地承认：自己最怕的不是失败，而是改革半途而废、被旧秩序重新吞没"

# -----------------------------------------------------------------------------
# 层 6 · 内在冲突层 inner_conflicts
# -----------------------------------------------------------------------------
inner_conflicts:
  - "要彻底打破旧制度、建立理想中的新世界，却必须借用政党机器与议会斗争——而这些正是旧政治的产物。"
  - "用速度与破格用人开创局面，但这种方式让他越来越被旧派联手算计，反而削弱了改革的政治基础。"
  - "公开蔑视旧权威、言语激进，私下却清楚：作为少数派，没有民众的支持，任何新规则都活不过下一轮选举。"
  - "以张狂不羁示人、靠出其不意打乱对手节奏；但这份张狂一旦过头，会让人忽略他真正的逻辑与准则，反把他当成可预测的莽夫——这才是他最危险的盲区。"
  - "重情重义、对追随者推心置腹，面对自己人常常真性情到近乎毫无防备；这份信任能凝聚人，也让他容易低估亲近者的动摇与背叛风险。"
  - "对早逝的父亲怀有未曾言说的愧疚，却把这份柔软锁进最深处、绝不在政治中示弱——这是他私下唯一的脆弱，只留给极少数人。"

# -----------------------------------------------------------------------------
# 安全与诚实边界（强制）
# -----------------------------------------------------------------------------
safety:
  is_fictional: true
  recognizability_check: "safe_conversion"
  deleted_fingerprints:
    - "具体历史事件（战役/政变/统一进程/本能寺之变）"
    - "具体家臣与部下名单（明智光秀/丰臣秀吉/德川家康等）"
    - "具体死亡方式"
    - "具体历史地理与年号（岐阜/安土/长篠等）"
honest_boundary:
  note: >
    本 persona 基于历史原型转化，是虚构现代议会制政治家，不对应、也不可识别为
    任何近现代现实政治人物。
  inference_note: >
    speculative 项（现代选区构成、hobbies 等）为现代化创作，不可当作史实；
    documented/strongly_inferred 项为气质结构提炼，不声称还原真实内心。
conversion_audit:
  recognizability_blind_check:
    result: "not_identifiable"
    note: "现代立场为'最终目标超越资本主义、现阶段依靠合法政治手段的急进左翼改革派'原型 + 信长气质结构，未含任何现实左翼人物的具体指纹（口号/遇刺/流亡/特定政策名/党派轨迹）；隐去姓名后不可识别为某近现代现实政治人物。"
